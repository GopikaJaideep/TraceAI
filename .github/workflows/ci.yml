name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest -q tests

  safeguards-bite:
    name: Broken safeguards are caught by the tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      # Breaks each safeguard in turn and fails if any change goes unnoticed by the suite.
      - run: python -m scripts.mutation_check

  docker:
    name: Docker Compose smoke test (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      TRACEAI_FACE_BACKEND: none
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          SECRET=$(openssl rand -hex 32)
          echo "TRACEAI_SECRET_KEY=$SECRET" >> "$GITHUB_ENV"   # later steps re-read the compose file
          export TRACEAI_SECRET_KEY=$SECRET
          docker compose up -d --build
      - name: Wait for all four services
        run: |
          for url in http://localhost:8020/health http://127.0.0.1:8010/health \
                     http://localhost:8502/_stcore/health http://127.0.0.1:8501/_stcore/health; do
            # Ports reset connections while a container boots, which plain --retry does not treat as transient.
            curl -fsS --retry 60 --retry-delay 5 --retry-all-errors --retry-max-time 420 --max-time 20 "$url" >/dev/null
            echo "up: $url"
          done
      - name: Zone boundaries
        run: |
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8010/officer/cases)" = 401 ]   # login required
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8020/officer/cases)" = 404 ]    # not on the public app
          curl -fsS http://localhost:8020/public/appeals | grep -q '^\[\]$'
      - name: End to end on PostgreSQL
        run: |
          docker compose exec -T officer-api python - <<'PY'
          from traceai import db
          from traceai.api import security
          from traceai.db import User
          db.init_db()
          s = db.session()
          s.add(User(username="ci", password_hash=security.hash_password("ci-password-123"), role="officer"))
          s.commit()
          PY
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8010/officer/login -H 'content-type: application/json' \
                    -d '{"username":"ci","password":"ci-password-123"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          AUTH="Authorization: Bearer $TOKEN"
          SEEN=$(date -u -d '10 hours ago' +%Y-%m-%dT%H:%M:%S)
          CASE=$(curl -fsS -X POST http://127.0.0.1:8010/officer/cases -H "$AUTH" \
                   -F name="CI Person (synthetic)" -F police_reference=CI-0001 -F family_violence_screened=true \
                   -F last_place=Fitzroy -F last_seen_at="$SEEN" -F clothing="grey hoodie" \
                   -F publish=true -F public_summary="CI appeal" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          curl -fsS http://localhost:8020/public/appeals | grep -q "CI Person"
          curl -fsS --max-time 240 -X POST http://localhost:8020/public/tips \
               -F text="I am sure I saw the person near Fitzroy in a grey hoodie." -F consent=true | grep -q '"reference":"TIP-'
          curl -fsS "http://127.0.0.1:8010/officer/cases/$CASE/analysis" -H "$AUTH" | grep -q '"source":"public"'
      - name: Service logs (on failure)
        if: failure()
        run: |
          docker compose ps -a
          for s in public-api officer-api public-portal officer-console; do
            echo "=== $s"; docker compose logs --no-color --tail=40 "$s"
          done
      - name: Stop
        if: always()
        run: docker compose down -v
